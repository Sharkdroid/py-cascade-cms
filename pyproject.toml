[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade-cms-rest"
version = "3.1.3"
description = "A typed, async REST client for Hannon Hill Cascade CMS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"          # uses `Self`, `TypeAlias`, PEP 604 unions
authors = [{ name = "Keith Shark" }]
dependencies = [
    "aiohttp-client-cache[sqlite]",
    "python-dotenv",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff", "build", "twine>=7.0.0"]

[project.urls]
Homepage = "https://github.com/Sharkdroid/py-cascade-cms"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_cms"]

[tool.ruff]
exclude = [
    # Manual human-run scripts against a live Cascade instance (see their own
    # docstrings) — not library code or automated tests, so lint rules aimed
    # at production code (narrow excepts, custom exception types, ...) don't
    # apply. tests/conftest.py also excludes these from pytest collection,
    # since their *_test.py names would otherwise make pytest import (and
    # execute) them as test modules.
    "tests/edit_test.py",
    "tests/testing.py",
]
