name: Docs Drift

# Replaces the old check-docs-drift.yml. Runs only after CI has passed on
# master. Compares operations.py/cmstypes.py signatures against the
# previous commit (stateless AST diff, no snapshot file). If a mapped
# method or payload model's signature changed, asks Gemini flash-lite to
# rewrite only that section of all-operations.md (matching existing
# style) and add one CHANGELOG.md line, then opens a PR against
# Sharkdroid.github.io. No PR is opened if there's no drift. Any failure
# (bad AST, Gemini output that won't validate after one retry, etc.) is
# printed and fails the job — no PR, no issue, just a red X in Actions.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  docs-drift:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout py-cascade-cms (at the commit CI just verified)
        uses: actions/checkout@v4
        with:
          path: py-cascade-cms
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2   # need HEAD~1 for the diff

      - name: Checkout Sharkdroid.github.io
        uses: actions/checkout@v4
        with:
          repository: Sharkdroid/Sharkdroid.github.io
          path: pages-repo
          token: ${{ secrets.DOCS_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml requests

      - name: Detect drift, draft with Gemini, open PR
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PYEOF'
          import ast, json, os, subprocess, sys, time
          import yaml, requests

          REPO = "py-cascade-cms"
          PAGES = "pages-repo"
          GEMINI_MODEL = "gemini-3.5-flash-lite"   # bump here if it changes
          WATCHED_FILES = ["src/cascade_cms/operations.py", "src/cascade_cms/cmstypes.py"]

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def git_show(rev, path):
              try:
                  return subprocess.run(
                      ["git", "-C", REPO, "show", f"{rev}:{path}"],
                      capture_output=True, text=True, check=True,
                  ).stdout
              except subprocess.CalledProcessError:
                  return None  # file didn't exist at that rev

          def func_sig(node):
              """(name -> (args, defaults, annotations)) for top-level or class methods."""
              args = [a.arg for a in node.args.args]
              annotations = [ast.unparse(a.annotation) if a.annotation else None for a in node.args.args]
              defaults = [ast.unparse(d) for d in node.args.defaults]
              return {"args": args, "annotations": annotations, "defaults": defaults}

          def class_fields(node):
              """(field_name -> (type, default)) for a pydantic-style class body."""
              fields = {}
              for stmt in node.body:
                  if isinstance(stmt, ast.AnnAssign) and isinstance(stmt.target, ast.Name):
                      fields[stmt.target.id] = {
                          "type": ast.unparse(stmt.annotation) if stmt.annotation else None,
                          "default": ast.unparse(stmt.value) if stmt.value else None,
                      }
              return fields

          def extract(source):
              """source text -> {'functions': {name: sig}, 'classes': {name: {field: info}}}"""
              if source is None:
                  return {"functions": {}, "classes": {}}
              tree = ast.parse(source)
              functions, classes = {}, {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.FunctionDef) and not node.name.startswith("_"):
                      functions[node.name] = func_sig(node)
                  elif isinstance(node, ast.ClassDef):
                      classes[node.name] = class_fields(node)
              return functions, classes

          # ---- load mapping ----
          try:
              with open(os.path.join(REPO, "doc_mapping.yml")) as f:
                  mapping = yaml.safe_load(f)
          except FileNotFoundError:
              fail("doc_mapping.yml not found in py-cascade-cms root.")

          doc_path = os.path.join(PAGES, mapping["operations_doc"])
          changelog_path = os.path.join(PAGES, mapping["changelog"])

          # ---- build old/new signature tables for both watched files ----
          old_funcs, old_classes, new_funcs, new_classes = {}, {}, {}, {}
          for path in WATCHED_FILES:
              old_src = git_show("HEAD~1", path)
              new_src = git_show("HEAD", path)
              try:
                  of, oc = extract(old_src)
                  nf, nc = extract(new_src)
              except SyntaxError as e:
                  fail(f"Could not parse {path}: {e}")
              old_funcs.update(of); old_classes.update(oc)
              new_funcs.update(nf); new_classes.update(nc)

          # ---- find drifted methods (via mapping, so only watched surface area counts) ----
          drifted = []  # list of dicts: method, heading, kind, old, new
          for method, info in mapping["methods"].items():
              old_sig = old_funcs.get(method)
              new_sig = new_funcs.get(method)
              if new_sig is None:
                  continue  # method not found in current source, skip rather than false-fail
              if old_sig != new_sig:
                  drifted.append({
                      "method": method, "heading": info["heading"], "kind": "signature",
                      "old": old_sig, "new": new_sig,
                  })
              model = info.get("payload_model")
              if model:
                  old_fields = old_classes.get(model)
                  new_fields = new_classes.get(model)
                  if new_fields is not None and old_fields != new_fields:
                      drifted.append({
                          "method": method, "heading": info["heading"], "kind": f"payload:{model}",
                          "old": old_fields, "new": new_fields,
                      })

          if not drifted:
              print("No signature or payload-model drift detected. Nothing to do.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_changes=false\n")
              sys.exit(0)

          print(f"Drift detected in {len(drifted)} item(s): {[d['method'] for d in drifted]}")

          # ---- pull current doc content once ----
          try:
              with open(doc_path) as f:
                  doc_text = f.read()
          except FileNotFoundError:
              fail(f"Doc file not found: {doc_path}")

          def extract_section(text, heading):
              marker = f"### `{heading}`"
              start = text.find(marker)
              if start == -1:
                  fail(f"Could not find section heading in docs: {heading}")
              next_h2 = text.find("\n## ", start)
              next_h3 = text.find("\n### ", start + 1)
              candidates = [i for i in (next_h2, next_h3) if i != -1]
              end = min(candidates) if candidates else len(text)
              return text[start:end], start, end

          def call_gemini(prompt):
              url = (
                  f"https://generativelanguage.googleapis.com/v1beta/models/"
                  f"{GEMINI_MODEL}:generateContent?key={os.environ['GEMINI_API_KEY']}"
              )
              body = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"responseMimeType": "application/json"},
              }
              resp = requests.post(url, json=body, timeout=60)
              resp.raise_for_status()
              return resp.json()["candidates"][0]["content"]["parts"][0]["text"]

          def draft_update(item, current_section):
              base_prompt = f"""You update one section of a Python library's API reference doc to
          reflect a signature change. Match the existing writing style and Markdown structure
          exactly. Do not touch anything outside this section. If a method was renamed or its
          logic clearly changed (not just arg names), say so plainly for readers relying on the
          old behavior.

          Method: {item['method']}
          Change type: {item['kind']}
          Old signature/fields: {json.dumps(item['old'])}
          New signature/fields: {json.dumps(item['new'])}

          Current doc section (rewrite this, keep the same heading and overall shape):
          ---
          {current_section}
          ---

          Respond with ONLY a JSON object, no markdown fences, no commentary:
          {{"updated_section": "<full replacement markdown for this section>",
            "changelog_entry": "<one line, e.g. '- \`{item['method']}\`: <what changed and why it matters>'"}}
          """
              last_err = None
              for attempt in range(2):
                  raw = call_gemini(base_prompt if attempt == 0 else
                                     base_prompt + f"\n\nYour previous response was not valid JSON ({last_err}). Try again, JSON only.")
                  try:
                      parsed = json.loads(raw)
                      if "updated_section" not in parsed or "changelog_entry" not in parsed:
                          raise ValueError("missing required keys")
                      return parsed
                  except (json.JSONDecodeError, ValueError) as e:
                      last_err = str(e)
                      continue
              fail(f"Gemini did not return valid JSON for '{item['method']}' after retry: {last_err}")

          # ---- apply updates ----
          changelog_lines = []
          for item in drifted:
              section_text, start, end = extract_section(doc_text, item["heading"])
              result = draft_update(item, section_text)
              doc_text = doc_text[:start] + result["updated_section"].rstrip() + "\n" + doc_text[end:]
              changelog_lines.append(result["changelog_entry"])

          with open(doc_path, "w") as f:
              f.write(doc_text)

          with open(changelog_path) as f:
              existing_changelog = f.read()
          today = time.strftime("%Y-%m-%d")
          entry_block = f"## {today} — automated docs update\n" + "\n".join(changelog_lines) + "\n\n"
          with open(changelog_path, "w") as f:
              f.write(entry_block + existing_changelog)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("has_changes=true\n")
              f.write("summary=" + ", ".join(d["method"] for d in drifted) + "\n")

          print("Docs updated locally, handing off to create-pull-request step.")
          PYEOF

      - name: Open PR
        if: steps.run.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DOCS_PR_TOKEN }}
          path: pages-repo
          commit-message: "docs: auto-update from py-cascade-cms signature drift"
          branch: docs-drift/${{ github.event.workflow_run.head_sha }}
          title: "Docs drift: ${{ steps.run.outputs.summary }}"
          body: |
            Auto-drafted by `docs-drift.yml` from
            [py-cascade-cms@${{ github.event.workflow_run.head_sha }}](https://github.com/Sharkdroid/py-cascade-cms/commit/${{ github.event.workflow_run.head_sha }}).

            Drafted with Gemini (gemini-3.5-flash-lite) from a signature-only diff — please review
            for accuracy before merging, especially any callouts about behavior changes.
          labels: docs-drift, automated
